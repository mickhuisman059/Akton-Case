<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CafeCorp — Performance Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root {
    --purple: #5B3399; --purple-light: #9B7FC4; --purple-dark: #3D2266;
    /* two extra steps so the revenue -> GP -> contribution ramp is
       distinguishable under colour-blindness (validated, see notes) */
    --purple-mid: #6B44A6; --purple-deep: #2E1A4D;
    --ink: #1C1B22; --slate: #6B6478; --line: #E3E0EA;
    --canvas: #F7F6F9; --surface: #FFFFFF;
    --good: #0E6B58; --bad: #C4326E;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px;
         background: var(--canvas); color: var(--ink); }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--purple-dark); }
  .sub { color: var(--slate); font-size: 13px; margin-bottom: 20px; }
  #pageHeader { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  #firmLogo { height: 48px; width: auto; flex-shrink: 0; }

  /* ---------- global filter bar ---------- */
  #filterBar { background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
               padding: 14px 16px; margin-bottom: 18px; display: flex; gap: 22px;
               flex-wrap: wrap; align-items: center; }
  .fgroup { display: flex; align-items: center; gap: 7px; }
  .fgroup > label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
                    color: var(--slate); font-weight: 700; }
  select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px;
           background: #fff; font-size: 13px; color: var(--ink); }
  .chip { padding: 4px 11px; border: 1px solid var(--line); background: #fff;
          border-radius: 13px; font-size: 12px; cursor: pointer; }
  .chip.on { background: var(--purple); color: #fff; border-color: var(--purple); }
  #resetBtn { margin-left: auto; padding: 5px 12px; border: 1px solid var(--line);
              background: #fff; border-radius: 4px; font-size: 12px; cursor: pointer; }
  #resetBtn:hover { border-color: var(--bad); color: var(--bad); }

  /* ---------- kpi cards ---------- */
  #kpiStrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
              gap: 12px; margin-bottom: 18px; }
  .kpiCard { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--purple);
             border-radius: 6px; padding: 14px 16px; }
  .kpiLabel { font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
              color: var(--slate); font-weight: 700; margin-bottom: 7px; }
  .kpiValue { font-size: 21px; font-weight: 700; }
  .kpiSub { font-size: 13px; font-weight: 600; color: var(--purple); }
  .kpiDelta { font-size: 12px; margin-top: 5px; font-weight: 600; }
  .kpiDelta.up { color: var(--good); } .kpiDelta.down { color: var(--bad); }
  .kpiDelta.none { color: var(--slate); font-weight: 400; }

  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 6px; padding: 16px 18px; margin-bottom: 14px; }
  .card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em;
             margin: 0 0 3px; padding-left: 10px; border-left: 3px solid var(--purple); }
  .card .note { font-size: 12px; color: var(--slate); margin-bottom: 14px; }

  /* findings */
  .finding { display:flex; gap:14px; padding:14px 0; border-top:1px solid var(--line); align-items:flex-start; }
  .finding:first-of-type { border-top:0; }
  .finding.sev-bad  { border-left:3px solid var(--bad); padding-left:14px; }
  .finding.sev-warn { border-left:3px solid #A8761A; padding-left:14px; background:#FDF6E9; padding:14px; border-radius:4px; }
  .finding.sev-none { border-left:3px solid var(--line); padding-left:14px; }
  .fnum { font-size:10px; font-weight:800; color:var(--purple); letter-spacing:.1em; padding-top:3px; }
  .finding h4 { font-size:13.5px; margin:0 0 5px; }
  .finding p { font-size:12.5px; color:#3A3644; margin:0; line-height:1.55; }
  /* tables */
  table { width:100%; border-collapse:collapse; font-size:12.5px; }
  th { text-align:right; font-size:9.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--slate);
       padding:0 8px 8px; border-bottom:1px solid var(--line); font-weight:700; white-space:nowrap; }
  th:first-child { text-align:left; padding-left:0; }
  td { text-align:right; padding:7px 8px; border-bottom:1px solid #F0EEF4; white-space:nowrap;
       font-variant-numeric:tabular-nums; }
  td:first-child { text-align:left; padding-left:0; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:#FAF9FC; }
  tbody tr.sel { background:#F3EDFA; box-shadow:inset 3px 0 0 var(--purple); }
  tr.tot td { border-top:1.5px solid var(--ink); border-bottom:0; font-weight:700; background:#FAFAFC; }
  .up { color:var(--good); } .down { color:var(--bad); }
  .tag { display:inline-block; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
         padding:2px 6px; border-radius:2px; margin-left:6px; }
  .t-flag { background:#FBE9F0; color:var(--bad); }
  .assume { background:#FAF9FC; border:1px dashed var(--line); border-radius:4px; padding:11px 13px;
            font-size:11.5px; color:#3A3644; margin-top:12px; line-height:1.55; }
  /* ladder */
  .ladder { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:0;
            border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .rung { padding:14px 16px; border-right:1px solid #F0EEF4; }
  .rung:last-child { border-right:0; }
  .rung.alert { background:linear-gradient(180deg,#FDF3F7 0%,#fff 60%); }
  .rname { font-size:14px; font-weight:700; }
  .rmeta { font-size:10.5px; color:var(--slate); margin-bottom:10px; }
  .drop { font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:2px; display:inline-block; margin-top:8px; }
  .drop.big { background:var(--bad); color:#fff; }
  .drop.small { background:#E4F0ED; color:var(--good); }
  .legend { display:flex; gap:16px; margin-top:11px; font-size:11px; color:#3A3644; flex-wrap:wrap; }
  .legend i { width:9px; height:9px; border-radius:1px; display:inline-block; margin-right:5px; }
  .warn { background: #FDF6E9; border-left: 3px solid #A8761A; padding: 11px 14px;
          font-size: 12.5px; border-radius: 4px; margin-bottom: 14px; }

#tabs { display:flex; gap:0; border-bottom:2px solid var(--line); margin-bottom:18px; }
  #tabs button { background:none; border:0; border-bottom:3px solid transparent; padding:11px 18px;
                 font-size:13px; font-weight:600; color:var(--slate); cursor:pointer; margin-bottom:-2px; }
  #tabs button:hover { color:var(--ink); }
  #tabs button.on { color:var(--purple-dark); border-bottom-color:var(--purple); }
  .section { display:none; }
  .section.on { display:block; }

  /* ---------- section 2: charts, matrix ---------- */
  .chartBox { position:relative; height:300px; }          /* Chart.js needs a sized parent */
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(400px,1fr)); gap:14px; }
  .grid2 > .card { margin-bottom:0; }
  .mtx th, .mtx td { text-align:center; }
  .mtx th:first-child, .mtx td:first-child { text-align:left; font-weight:600; }
  .mtx tbody tr { cursor:default; }
  .mtx tbody tr:hover { background:transparent; }
  .cell { display:block; border-radius:3px; padding:8px 4px; font-weight:700;
          font-variant-numeric:tabular-nums; }
  .cell small { display:block; font-weight:400; font-size:9.5px; color:var(--slate); margin-top:2px; }
  .swatch { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:#3A3644; }
  .swatch i { width:9px; height:9px; border-radius:1px; display:inline-block; }

  /* ---------- section 3: income statement ---------- */
  .grid2col { display:grid; grid-template-columns:1.3fr 1fr; gap:14px; align-items:start; }
  @media (max-width:900px) { .grid2col { grid-template-columns:1fr; } }
  .chartBoxTall { position:relative; height:360px; }
  .chartBoxShort { position:relative; height:260px; }
  tr.subtot td { border-top:1px solid var(--ink); font-weight:700; }
  tr.rowgroup td { padding-top:16px; font-size:9.5px; text-transform:uppercase;
                   letter-spacing:.08em; color:var(--slate); font-weight:700; border-bottom:0; }
  .peerStat { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #F0EEF4; font-size:12.5px; }
  .peerStat:first-child { border-top:0; }
  .peerStat b { font-variant-numeric:tabular-nums; }
</style>
</head>

<script>
// ═══════════════════════════════════════════════════════════
// SHARED STATE — every section reads from this, nothing else.
// Change state -> call render() -> everything redraws consistently.
// ═══════════════════════════════════════════════════════════
const STATE = {
  period: 'year',        // 'month' | 'quarter' | 'year' | 'all' | 'custom'
  year: '2025',
  quarter: '2025-Q4',
  month: '2025-12',
  from: '2025-01', to: '2025-12',
  locs: new Set(),       // empty = all
  chans: new Set(),      // empty = all
  cats: new Set(),       // empty = all
  view: 'format',        // chart mode: 'format' | 'location'
  selectedFormat: null,
  selectedLoc: null,
  tab: 'exec',   // 'exec' | 'sales' | 'pl' | 'inventory'
  prodSort: { key:'rev', dir:-1 },   // product table sort column + direction
};

const BRAND = {
  purple:'#5B3399', purpleLight:'#9B7FC4', slate:'#6B6478',
  fade:'rgba(107,100,120,0.15)', good:'#0E6B58', bad:'#C4326E'
};
const FORMAT_COLORS = { Flagship: BRAND.purple, Standard: BRAND.slate, Kiosk: BRAND.purpleLight };

// Ordinal purple ramp for cohort (older store <-> newer store has a real order,
// so light->dark, not an arbitrary categorical hue per value). One definition,
// reused everywhere a cohort needs a colour: the efficiency scatter, the
// scorecard tags. Raw values ('Same-store' etc.) stay the lookup keys — logic
// and equality checks never touch the display strings.
const COHORT_COLOR = { 'Same-store':'#2E1A4D', '2024 openings':'#6B44A6', '2025 openings':'#9B7FC4' };
const COHORT_LABEL = { 'Same-store':'Established', '2024 openings':'Opened 2024', '2025 openings':'Opened 2025' };
const cohortLabel = raw => COHORT_LABEL[raw] || raw;
// Scorecard-tag-only colours. Every tag carries its full name as text, so
// colour is a reinforcing cue there, not the sole identifier — unlike the
// scatter chart's dots (COHORT_COLOR, unchanged), which rely on colour +
// legend with no per-mark label. That's why this can afford to sit closer to
// the mid step than COHORT_COLOR does: white text needs backgrounds dark
// enough that the lightest step and the mid step converge somewhat.
// Contrast checked (white text): #2E1A4D 15.3 / #6B44A6 7.0 / #7A5CA6 5.4 —
// all clear the 4.5 WCAG AA threshold for this font size.
const COHORT_TAG_COLOR = { 'Same-store':'#2E1A4D', '2024 openings':'#6B44A6', '2025 openings':'#7A5CA6' };

// Chart.js instances, keyed by canvas id. Section 2 has several charts, so a
// single `chart` variable no longer works. upsertChart() destroys any previous
// instance bound to that id before creating the new one — without the destroy,
// Chart.js throws "Canvas is already in use" the second time a section rebuilds.
const CHARTS = {};
function upsertChart(id, config) {
  const el = document.getElementById(id);
  if (!el) return;                       // section not rendered — nothing to draw
  if (CHARTS[id]) CHARTS[id].destroy();
  CHARTS[id] = new Chart(el, config);
}

// Shared Chart.js defaults so every chart in the dashboard reads as one system.
const AXIS = { grid: { color:'#F0EEF4' }, border: { display:false },
               ticks: { color:'#6B6478', font:{ size:11 } } };
const MXN  = v => '$' + (v/1e6).toFixed(1) + 'M';

// ═══════════════════════════════════════════════════════════
// PERIOD RESOLUTION — turn STATE.period into month index bounds
// ═══════════════════════════════════════════════════════════

// prior-year equivalent range (same months, 12 earlier). null if unavailable.

// ═══════════════════════════════════════════════════════════
// THE CORE: compute a full P&L for the current filter state.
// This replaces the pre-baked KPI object — everything is live.
// ═══════════════════════════════════════════════════════════
function computePL(a, b, opts = {}) {
  const locFilter  = opts.locs  || STATE.locs;
  const chanFilter = opts.chans || STATE.chans;
  const catFilter  = opts.cats  || STATE.cats;

  const okL = l => locFilter.size  === 0 || locFilter.has(l);
  const okC = c => chanFilter.size === 0 || chanFilter.has(c);
  const okP = p => catFilter.size  === 0 || catFilter.has(DATA.products[p].cat);

  let revenue=0, cogs=0, discount=0, units=0, commission=0, tickets=0;
  const byMonth = DATA.months.map(() => ({ rev:0, cogs:0, comm:0, units:0, disc:0 }));
  const byLoc   = DATA.locations.map(() => ({ rev:0, cogs:0, comm:0, units:0, disc:0, opex:0 }));
  const byChan  = DATA.channels.map(() => ({ rev:0, cogs:0, comm:0, units:0, disc:0 }));
  const byCat   = DATA.categories.map(() => ({ rev:0, cogs:0, comm:0, units:0, disc:0 }));

  // --- sales fact: [monthIdx, locIdx, chanIdx, prodIdx, qty, net, disc] ---
  for (const r of DATA.sales) {
    const [m, l, c, p, q, net, disc] = r;
    if (m < a || m > b || !okL(l) || !okC(c) || !okP(p)) continue;
    const cg = q * DATA.products[p].cost;
    const cm = net * DATA.channels[c].comm;
    revenue += net; cogs += cg; discount += disc; units += q; commission += cm;
    byMonth[m].rev += net; byMonth[m].cogs += cg; byMonth[m].comm += cm; byMonth[m].units += q; byMonth[m].disc += disc;
    byLoc[l].rev   += net; byLoc[l].cogs   += cg; byLoc[l].comm   += cm; byLoc[l].units   += q; byLoc[l].disc   += disc;
    byChan[c].rev  += net; byChan[c].cogs  += cg; byChan[c].comm  += cm; byChan[c].units  += q; byChan[c].disc  += disc;
    const k = DATA.products[p].cat;
    byCat[k].rev   += net; byCat[k].cogs   += cg; byCat[k].comm   += cm; byCat[k].units   += q; byCat[k].disc   += disc;
  }

  // --- tickets fact: [monthIdx, locIdx, chanIdx, tickets] ---
  for (const r of DATA.tickets) {
    const [m, l, c, t] = r;
    if (m < a || m > b || !okL(l) || !okC(c)) continue;
    tickets += t;
  }

  // --- expenses fact: [monthIdx, locIdx, labor, rent, util, mkt, other] ---
  // CRITICAL: expenses exist only at month x location. They carry NO channel
  // or category dimension. So when those filters are active, opex must be
  // ALLOCATED pro-rata on revenue share — it is an estimate, not a measurement.
  const chanFiltered = chanFilter.size > 0 && chanFilter.size < DATA.channels.length;
  const catFiltered  = catFilter.size  > 0 && catFilter.size  < DATA.categories.length;
  const allocated = chanFiltered || catFiltered;

  let shareByLocMonth = null;
  if (allocated) {
    const num = {}, den = {};
    for (const r of DATA.sales) {
      const [m, l, c, p, q, net] = r;
      if (m < a || m > b || !okL(l)) continue;
      const key = m + '|' + l;
      den[key] = (den[key] || 0) + net;
      if (okC(c) && okP(p)) num[key] = (num[key] || 0) + net;
    }
    shareByLocMonth = {};
    for (const k in den) shareByLocMonth[k] = den[k] > 0 ? (num[k] || 0) / den[k] : 0;
  }

  let labor=0, rent=0, util=0, mkt=0, other=0;
  for (const r of DATA.expenses) {
    const [m, l, lb, rn, ut, mk, ot] = r;
    if (m < a || m > b || !okL(l)) continue;
    const s = allocated ? (shareByLocMonth[m + '|' + l] || 0) : 1;
    labor += lb*s; rent += rn*s; util += ut*s; mkt += mk*s; other += ot*s;
    byLoc[l].opex += (lb + rn + ut + mk + ot) * s;
  }
  const opex = labor + rent + util + mkt + other;

  // --- targets fact: [monthIdx, locIdx, chanIdx, catIdx, salesTgt, gpTgt] ---
  let salesTarget = 0, gpTarget = 0;
  for (const r of DATA.targets) {
    const [m, l, c, k, st, gt] = r;
    if (m < a || m > b || !okL(l) || !okC(c)) continue;
    if (catFilter.size > 0 && !catFilter.has(k)) continue;
    salesTarget += st; gpTarget += gt;
  }

  const grossProfit  = revenue - cogs;
  const contribution = grossProfit - commission;
  const operating    = contribution - opex;

  return {
    revenue, cogs, discount, units, commission, tickets, opex,
    labor, rent, util, mkt, other, salesTarget, gpTarget,
    grossProfit, contribution, operating,
    grossMarginPct:  revenue ? 100 * grossProfit  / revenue : 0,
    contributionPct: revenue ? 100 * contribution / revenue : 0,
    operatingPct:    revenue ? 100 * operating    / revenue : 0,
    avgTicket: tickets ? revenue / tickets : 0,
    allocated, byMonth, byLoc, byChan, byCat
  };
}

// ═══════════════════════════════════════════════════════════
// FORMATTING
// ═══════════════════════════════════════════════════════════
const money = v => (v < 0 ? '-' : '') + '$' + (Math.abs(v)/1e6).toFixed(1) + 'M';
const pct   = v => v.toFixed(1) + '%';
// thousands — for figures too small to read in millions (revenue per m², etc.)
const moneyK = v => (v < 0 ? '-' : '') + '$' + Math.round(Math.abs(v)/1e3) + 'k';
// plain integer with separators — units sold
const num = v => Math.round(v).toLocaleString('en-US');
// full-precision peso amount — for per-unit prices/costs (money() divides by
// 1e6 for headline aggregates, which would turn a $27.47 cost into garbage)
const moneyUnit = v => '$' + v.toFixed(2);

// ═══════════════════════════════════════════════════════════
// RENDER — the single entry point. Any state change calls this.
// ═══════════════════════════════════════════════════════════
function render() {
  const [a, b] = resolveRange();
  const cur = computePL(a, b);
  const pr  = priorRange();
  const py  = pr ? computePL(pr[0], pr[1]) : null;

  buildFilterBar();
  buildTabs();
  buildAllocWarning(cur);

  if (STATE.tab === 'exec') {
    buildKPIStrip(cur, py);
    buildFindings();
    buildLadder();
    buildCohortTable();
    buildScorecard();
  }
  if (STATE.tab === 'sales') {
    buildSalesTrend(a, b);
    buildChannelBreakdown(a, b);
    buildCategoryBreakdown(a, b);
    buildCatChanMatrix(a, b);
    buildLocationEfficiency(a, b);
    buildProductTable(a, b);
  }
  if (STATE.tab === 'pl') {
    buildWaterfall(cur);
    buildStatement(cur, py);
    buildLocMargin(a, b);
    buildSalesTargetChart(a, b);
  }
  if (STATE.tab === 'inventory') {
    buildWasteByLoc(a, b);
    buildWasteOverTime(a, b);
    buildWasteByItem(a, b);
    buildDoiByLoc(a, b);
    buildItemTable(a, b);
  }
}

function buildAllocWarning(pl) {

// ---------- KPI strip ----------
function buildKPIStrip(cur, py) {
  const cards = [
    { label:'Net revenue',      val: money(cur.revenue),      pyv: py && py.revenue,      cv: cur.revenue },
    { label:'Gross profit',     val: money(cur.grossProfit),  sub: pct(cur.grossMarginPct),
      pp: py ? cur.grossMarginPct - py.grossMarginPct : null },
    { label:'Contribution',     val: money(cur.contribution), sub: pct(cur.contributionPct),
      pp: py ? cur.contributionPct - py.contributionPct : null },
    { label:'Operating profit', val: money(cur.operating),    sub: pct(cur.operatingPct),
      pp: py ? cur.operatingPct - py.operatingPct : null },
    { label:'Avg ticket',       val: '$' + cur.avgTicket.toFixed(0),
      sub: cur.tickets ? (cur.units/cur.tickets).toFixed(1) + ' items/ticket' : '',
      pyv: py && py.avgTicket, cv: cur.avgTicket },
    // one card covers both target types — sales attainment as the headline
    // number (unchanged), GP attainment takes the slot that would otherwise
    // just say "no prior-year comparison" (a target card has no PY delta
    // anyway), so this adds real information without adding a 7th card.
    { label:'vs targets',       val: cur.salesTarget ? pct(100*cur.revenue/cur.salesTarget) : '—',
      sub: cur.salesTarget ? money(cur.revenue - cur.salesTarget) + ' sales gap' : '',
      custom: cur.gpTarget ? (() => {
        const gpAtt = 100 * cur.grossProfit / cur.gpTarget;
        const cls = gpAtt >= 100 ? 'up' : 'down';
        return `<div class="kpiDelta ${cls}">${gpAtt>=100?'▲':'▼'} ${gpAtt.toFixed(1)}% of GP target</div>`;
      })() : null }
  ];

  document.getElementById('kpiStrip').innerHTML = cards.map(c => {
    let delta = '<div class="kpiDelta none">no prior-year comparison</div>';
    if (c.pp !== null && c.pp !== undefined) {
      const cls = c.pp >= 0 ? 'up' : 'down';
      delta = `<div class="kpiDelta ${cls}">${c.pp >= 0 ? '▲' : '▼'} ${Math.abs(c.pp).toFixed(1)}pp vs prior year</div>`;
    } else if (c.pyv) {
      const d = 100 * (c.cv / c.pyv - 1);
      const cls = d >= 0 ? 'up' : 'down';
      delta = `<div class="kpiDelta ${cls}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}% vs prior year</div>`;
    }
    if (c.custom !== undefined && c.custom !== null) delta = c.custom;
    return `<div class="kpiCard">
      <div class="kpiLabel">${c.label}</div>
      <div class="kpiValue">${c.val}${c.sub ? ` <span class="kpiSub">${c.sub}</span>` : ''}</div>
      ${delta}</div>`;
  }).join('');
}

// ---------- chart ----------
function withOpacity(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function buildChartDatasets(a, b) {
  const labels = DATA.months.slice(a, b+1);
  // revenue per location per month, respecting channel/category filters
  const perLoc = DATA.locations.map(() => new Array(labels.length).fill(0));
  const okC = c => STATE.chans.size === 0 || STATE.chans.has(c);
  const okP = p => STATE.cats.size  === 0 || STATE.cats.has(DATA.products[p].cat);
  for (const r of DATA.sales) {
    const [m, l, c, p, q, net] = r;
    if (m < a || m > b || !okC(c) || !okP(p)) continue;
    perLoc[l][m - a] += net;
  }

  if (STATE.view === 'format') {
    return ['Flagship','Standard','Kiosk'].map(fmt => {
      const members = DATA.locations.map((l,i) => l.format === fmt ? i : -1).filter(i => i >= 0);
      const summed = labels.map((_, t) => members.reduce((s, i) => s + perLoc[i][t], 0));
      const active = STATE.selectedFormat === null || STATE.selectedFormat === fmt;
      return { label: `${fmt} (${members.length})`, data: summed,
               borderColor: withOpacity(FORMAT_COLORS[fmt], active ? 1 : 0.15),
               borderWidth: STATE.selectedFormat === fmt ? 3 : 2, pointRadius: 0, tension: .25 };
    });
  }
  return DATA.locations.map((l, i) => {
    const active = STATE.selectedLoc === null || STATE.selectedLoc === i;
    return { label: l.name, data: perLoc[i],
             borderColor: active ? withOpacity(FORMAT_COLORS[l.format], 1) : BRAND.fade,
             borderWidth: STATE.selectedLoc === i ? 3 : 1.2, pointRadius: 0, tension: .25 };
  });
}

function drawChart(a, b) {
  upsertChart('revChart', {
    type: 'line',
    data: { labels: DATA.months.slice(a, b+1), datasets: buildChartDatasets(a, b) },
    options: { responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 }, color: '#3A3644' } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${MXN(c.parsed.y)}` } }
      },
      scales: { x: AXIS, y: { ...AXIS, ticks: { ...AXIS.ticks, callback: MXN } } } }
  });
}

// ═══════════════════════════════════════════════════════════
// PERIOD RESOLUTION — full brief requirement: month/quarter/year/custom
// ═══════════════════════════════════════════════════════════
function resolveRange() {
  const M = DATA.months;
  const last = M.length - 1;
  if (STATE.period === 'all')   return [0, last];
  if (STATE.period === 'month') { const i = M.indexOf(STATE.month); return i < 0 ? [last,last] : [i,i]; }
  if (STATE.period === 'quarter') {
    const [y, q] = STATE.quarter.split('-Q');
    const startM = String((+q - 1) * 3 + 1).padStart(2,'0');
    const i = M.indexOf(`${y}-${startM}`);
    return i < 0 ? [last,last] : [i, Math.min(i + 2, last)];
  }
  if (STATE.period === 'custom') {
    const a = M.indexOf(STATE.from), b = M.indexOf(STATE.to);
    return [a < 0 ? 0 : a, b < 0 ? last : b];
  }
  // year
  const idx = M.map((m,i) => m.startsWith(STATE.year) ? i : -1).filter(i => i >= 0);
  return idx.length ? [idx[0], idx[idx.length-1]] : [0,last];
}

function priorRange() {
  const [a,b] = resolveRange();
  return (a - 12 >= 0) ? [a - 12, b - 12] : null;
}

function periodLabel() {
  const [a,b] = resolveRange();
  return a === b ? DATA.months[a] : `${DATA.months[a]} – ${DATA.months[b]}`;
}

  const years = [...new Set(M.map(m => m.slice(0,4)))];
  const quarters = [];
  years.forEach(y => [1,2,3,4].forEach(q => {
    if (M.some(m => m.startsWith(y) && Math.ceil(+m.slice(5,7)/3) === q)) quarters.push(`${y}-Q${q}`);
