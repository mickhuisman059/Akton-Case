  else if (STATE.period === 'quarter')
    periodCtl = `<select id="fQuarter">${quarters.map(q=>`<option${STATE.quarter===q?' selected':''}>${q}</option>`).join('')}</select>`;
  else if (STATE.period === 'month')
    periodCtl = `<select id="fMonth">${M.map(m=>`<option${STATE.month===m?' selected':''}>${m}</option>`).join('')}</select>`;
  else if (STATE.period === 'custom')
    periodCtl = `<select id="fFrom">${M.map(m=>`<option${STATE.from===m?' selected':''}>${m}</option>`).join('')}</select>
                 <span style="color:var(--slate);font-size:12px">to</span>
                 <select id="fTo">${M.map(m=>`<option${STATE.to===m?' selected':''}>${m}</option>`).join('')}</select>`;

  box.innerHTML = `
    <div class="fgroup"><label>Period</label>
      <select id="fPeriod">
        ${['month','quarter','year','all','custom'].map(p =>
          `<option value="${p}"${STATE.period===p?' selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}
      </select>
      ${periodCtl}
    </div>
    <div class="fgroup"><label>Channel</label><span id="fChans"></span></div>
    <div class="fgroup"><label>Category</label><span id="fCats"></span></div>
    <div class="fgroup"><label>Location</label>
      <select id="fLoc"><option value="">All 16 locations</option>
        ${DATA.locations.map((l,i)=>`<option value="${i}"${STATE.locs.has(i)?' selected':''}>${l.name}</option>`).join('')}
      </select></div>
    <button id="resetBtn">Clear filters</button>`;

  const cbox = document.getElementById('fChans');
  DATA.channels.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (STATE.chans.has(i) ? ' on' : '');
    b.textContent = c.name;
    b.onclick = () => { STATE.chans.has(i) ? STATE.chans.delete(i) : STATE.chans.add(i); render(); };
    cbox.appendChild(b);
  });
  const kbox = document.getElementById('fCats');
  DATA.categories.forEach((c,i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (STATE.cats.has(i) ? ' on' : '');
    b.textContent = c;
    b.onclick = () => { STATE.cats.has(i) ? STATE.cats.delete(i) : STATE.cats.add(i); render(); };
    kbox.appendChild(b);
  });

  document.getElementById('fPeriod').onchange = e => { STATE.period = e.target.value; render(); };
  const bind = (id, key) => { const el = document.getElementById(id); if (el) el.onchange = e => { STATE[key] = e.target.value; render(); }; };
  bind('fYear','year'); bind('fQuarter','quarter'); bind('fMonth','month');
  bind('fFrom','from'); bind('fTo','to');

  document.getElementById('fLoc').onchange = e => {
    STATE.locs.clear();
    if (e.target.value !== '') { STATE.locs.add(+e.target.value); STATE.view='location'; STATE.selectedLoc=+e.target.value; }
    else { STATE.view='format'; STATE.selectedLoc=null; }
    render();
  };
  document.getElementById('resetBtn').onclick = () => {
    STATE.locs.clear(); STATE.chans.clear(); STATE.cats.clear();
    STATE.view='format'; STATE.selectedLoc=null; STATE.selectedFormat=null;
    render();
  };
}

// ═══════════════════════════════════════════════════════════
// FINDINGS BLOCK — conclusions in prose, computed live
// ═══════════════════════════════════════════════════════════
// Worst-performing location by FY2025 operating margin, vs its like-for-like peer
// set (same format + same cohort). Shared by Finding 3 on the Executive Summary
// and the dedicated panel in Section 3 — both need the identical comparison, so
// it's computed once here rather than kept in sync by hand in two places.
function worstLocVsPeers() {
  const M = DATA.months;
  const yr = y => { const i = M.findIndex(m=>m.startsWith(y)); let j=i; M.forEach((m,k)=>{if(m.startsWith(y))j=k}); return [i,j]; };
  const [a,b] = yr('2025');
  const all = computePL(a, b, {locs:new Set(), chans:new Set(), cats:new Set()});

  const locStats = DATA.locations.map((l,i)=>{
    const x = all.byLoc[i]; const gp = x.rev - x.cogs; const op = gp - x.comm - x.opex;
    return { i, name:l.name, fmt:l.format, cohort:l.cohort, rev:x.rev, opex:x.opex,
             opm: x.rev ? 100*op/x.rev : 0, gpm: x.rev ? 100*gp/x.rev : 0,
             opexPctRev: x.rev ? 100*x.opex/x.rev : 0 };
  }).filter(s=>s.rev>0).sort((p,q)=>p.opm-q.opm);

  const worst = locStats[0], best = locStats[locStats.length-1];
  // Peer set: same FORMAT and same COHORT, so the comparison is like-for-like on
  // both store size and maturity — this is the step that separates "costs are
  // high" from "revenue is low," which look identical as ratios alone.
  const peers = locStats.filter(s => s.i !== worst.i && s.fmt === worst.fmt && s.cohort === worst.cohort);
  const avg = k => peers.length ? peers.reduce((s,p) => s + p[k], 0) / peers.length : 0;

  return {
    a, b, worst, best, peers, locStats,
    revGap:  avg('rev')  ? 100*(worst.rev  / avg('rev')  - 1) : 0,
    opexGap: avg('opex') ? 100*(worst.opex / avg('opex') - 1) : 0,
    gpmGap:  worst.gpm - avg('gpm'),
    opexPctGap: worst.opexPctRev - avg('opexPctRev'),
    opmGap: worst.opm - avg('opm'),
    peerRev: avg('rev'), peerOpex: avg('opex'), peerGpm: avg('gpm'),
    peerOpexPct: avg('opexPctRev'), peerOpm: avg('opm')
  };
}

function buildFindings() {
  const M = DATA.months;
  const yr = y => { const i = M.findIndex(m=>m.startsWith(y)); let j=i; M.forEach((m,k)=>{if(m.startsWith(y))j=k}); return [i,j]; };
  const y24 = yr('2024'), y25 = yr('2025');

  // cohort revenue (ignores location filter deliberately — this is a structural finding)
  const cohortRev = (cohort, range) => {
    const locs = new Set(DATA.locations.map((l,i)=>l.cohort===cohort?i:-1).filter(i=>i>=0));
    return computePL(range[0], range[1], {locs, chans:new Set(), cats:new Set()}).revenue;
  };
  const ss24 = cohortRev('Same-store', y24), ss25 = cohortRev('Same-store', y25);
  const ssGrowth = 100*(ss25/ss24 - 1);
  const tot24 = computePL(y24[0],y24[1],{locs:new Set(),chans:new Set(),cats:new Set()}).revenue;
  const tot25 = computePL(y25[0],y25[1],{locs:new Set(),chans:new Set(),cats:new Set()}).revenue;
  const grpGrowth = 100*(tot25/tot24 - 1);
  const ssCount = DATA.locations.filter(l=>l.cohort==='Same-store').length;

  // Every finding below is fixed to full-year 2025 across all 16 stores and ignores
  // the filter bar. These are structural conclusions about the business, not a filtered
  // view — if they moved on every click they would stop being findings. The ladder,
  // scorecard and Section 2 are the analytical tools that DO respond to filters.
  const [a,b] = y25;
  const all = computePL(a, b, {locs:new Set(), chans:new Set(), cats:new Set()});
  const di = DATA.channels.findIndex(c=>c.name==='Delivery');
  const dv = all.byChan[di];
  const dvGP = dv.rev ? 100*(dv.rev-dv.cogs)/dv.rev : 0;
  const dvCM = dv.rev ? 100*(dv.rev-dv.cogs-dv.comm)/dv.rev : 0;
  const dine = all.byChan[DATA.channels.findIndex(c=>c.name==='Dine-in')];
  const dineCM = dine.rev ? 100*(dine.rev-dine.cogs-dine.comm)/dine.rev : 0;
  const dvContrib = dv.rev - dv.cogs - dv.comm;

  // worst location vs its like-for-like peers — full mechanics live in the
  // Income Statement panel (worstLocVsPeers() is shared with it); only the
  // headline number is needed here.
  const cmp = worstLocVsPeers();
  const { worst } = cmp;

  // waste
  let usage=0, waste=0;
  for (const r of DATA.inventory) {
    const [m,l,it,op,pu,us,wa] = r;
    if (m<a||m>b) continue;
    const c = DATA.items[it].cost;
    usage += us*c; waste += wa*c;
  }
  const wastePct = (usage+waste) ? 100*waste/(usage+waste) : 0;

  document.getElementById('findings').innerHTML = `
    <div class="card"><h3>The headline</h3>
    <div class="note">What leadership needs to know first, in order of financial materiality.
    <b>Fixed to full-year 2025 vs 2024, all 16 locations</b> — these are structural conclusions,
    so they deliberately do not move with the filter bar. Everything below them does.</div>
    <div class="finding sev-bad"><span class="fnum">01</span><div>
      <h4>Reported growth of ${grpGrowth.toFixed(1)}% is mostly new stores, not a stronger business</h4>
      <p>Established locations (${ssCount} of 16) grew just <b>${ssGrowth.toFixed(1)}%</b> — the rest is
      new-store footprint, not underlying improvement.</p></div></div>
    <div class="finding sev-warn"><span class="fnum">02</span><div>
      <h4>Delivery earns a normal gross margin, then pays ${(dvGP-dvCM).toFixed(1)}pp of it to the aggregator</h4>
      <p>Gross margin (<b>${dvGP.toFixed(1)}%</b>) matches dine-in, but it still contributes
      <b>${money(dvContrib)}</b> — the fix is menu mix on that channel, not cutting it.
      See Sales &amp; Gross Profit for the category-level detail.</p></div></div>
    <div class="finding ${worst && worst.opm < 0 ? 'sev-bad':'sev-warn'}"><span class="fnum">03</span><div>
      <h4>${worst.name} is the largest single drag — and it is a demand problem, not a cost problem</h4>
      <p>Revenue is <b>${Math.abs(cmp.revGap).toFixed(0)}%</b> below comparable peers while its cost base is
      in line — not overspending, just underselling. See Income Statement for the peer comparison.</p></div></div>
    <div class="finding sev-none"><span class="fnum">04</span><div>
      <h4>Waste runs at ${wastePct.toFixed(2)}% of throughput</h4>
      <p><b>${money(waste)}</b> written off. A uniform rate across stores and items points to an
      ordering/shelf-life process, not one bad product line. See Inventory for the full breakdown.</p></div></div>`;
}

// ═══════════════════════════════════════════════════════════
// GROWTH DECOMPOSITION TABLE
// ═══════════════════════════════════════════════════════════
// Growth decomposition — deliberately chart-only, no table underneath. Every
// number that used to live in a table row (revenue both years, growth %,
// store count) is now drawn directly on the chart via cohortLabels below, so
// there's nothing left to explain in prose. Op margin is dropped from this
// specific view — it's already covered by the scorecard and the Section 2
// efficiency scatter, and repeating it here just to fill a table column added
// a metric this chart isn't actually about (growth, not profitability).
function buildCohortTable() {
  const M = DATA.months;
  const yr = y => { const i=M.findIndex(m=>m.startsWith(y)); let j=i; M.forEach((m,k)=>{if(m.startsWith(y))j=k}); return [i,j]; };
  const y24 = yr('2024'), y25 = yr('2025');
  const cohorts = ['Same-store','2024 openings','2025 openings'];

  const rows = cohorts.map(c => {
    const locs = new Set(DATA.locations.map((l,i)=>l.cohort===c?i:-1).filter(i=>i>=0));
    const p24 = computePL(y24[0],y24[1],{locs,chans:new Set(),cats:new Set()});
    const p25 = computePL(y25[0],y25[1],{locs,chans:new Set(),cats:new Set()});
    return { label:`${cohortLabel(c)} (${locs.size})`, r24:p24.revenue, r25:p25.revenue,
             growth: p24.revenue ? 100*(p25.revenue/p24.revenue-1) : null };
  });

  document.getElementById('cohortTable').innerHTML = `
    <div class="card"><h3>Growth decomposition — 2025 vs 2024</h3>
    <div class="note">Established locations are the only fair year-over-year comparison — new stores inflate
    the group total shown at the top of the page.</div>
    <div class="chartBoxTall"><canvas id="cohortChart"></canvas></div></div>`;

  // Same light->deep purple ramp used for the funnel bars elsewhere — 2024 in
  // the lighter step, 2025 in the deeper one. 2025-openings has no 2024 bar
  // (null, not zero) since it has no prior-year baseline at all.
  const cohortLabels = {
    id: 'cohortLabels',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.textAlign = 'center';
      const m24 = chart.getDatasetMeta(0).data, m25 = chart.getDatasetMeta(1).data;
      ctx.font = '600 11px system-ui, -apple-system, sans-serif';
      ctx.fillStyle = '#3A3644';
      rows.forEach((r,i) => {
        if (r.r24) ctx.fillText(MXN(r.r24), m24[i].x, m24[i].y - 6);
        ctx.fillText(MXN(r.r25), m25[i].x, m25[i].y - 6);
      });
      ctx.font = '700 12px system-ui, -apple-system, sans-serif';
      rows.forEach((r,i) => {
        const topY = (r.r24 ? Math.min(m24[i].y, m25[i].y) : m25[i].y) - 24;
        const cx = r.r24 ? (m24[i].x + m25[i].x) / 2 : m25[i].x;
        const label = r.growth !== null ? `${r.growth>=0?'+':''}${r.growth.toFixed(1)}%` : 'new in 2025';
        ctx.fillStyle = r.growth === null ? '#6B6478' : (r.growth >= 0 ? '#0E6B58' : '#C4326E');
        ctx.fillText(label, cx, topY);
      });
      ctx.restore();
    }
  };

  upsertChart('cohortChart', {
    type: 'bar',
    data: { labels: rows.map(r=>r.label), datasets: [
      { label:'2024 revenue', data: rows.map(r=>r.r24 || null), backgroundColor:'#9B7FC4',
        borderRadius:{topLeft:4,topRight:4}, categoryPercentage:0.6, barPercentage:0.85 },
      { label:'2025 revenue', data: rows.map(r=>r.r25), backgroundColor:'#2E1A4D',
        borderRadius:{topLeft:4,topRight:4}, categoryPercentage:0.6, barPercentage:0.85 }
    ] },
    options: { responsive:true, maintainAspectRatio:false,
      layout: { padding: { top: 44 } },   // room for the growth-% label drawn above the tallest bar
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, font:{size:11}, color:'#3A3644' } },
        tooltip: { callbacks: { label:c => `${c.dataset.label}: ${MXN(c.parsed.y)}` } }
      },
      scales: { x:AXIS, y:{ ...AXIS, beginAtZero:true, ticks:{ ...AXIS.ticks, callback:MXN } } } },
    plugins: [cohortLabels]
  });
}

// ═══════════════════════════════════════════════════════════
// CHANNEL MARGIN LADDER — Finding 2 as a picture
// ═══════════════════════════════════════════════════════════
function buildLadder() {
  const [a,b] = resolveRange();
  const pl = computePL(a, b, {locs: STATE.locs, chans: new Set(), cats: STATE.cats});
  const rungs = DATA.channels.map((c,i) => {
    const x = pl.byChan[i];
    const gpm = x.rev ? 100*(x.rev-x.cogs)/x.rev : 0;
    const cm  = x.rev ? 100*(x.rev-x.cogs-x.comm)/x.rev : 0;
    return { name:c.name, comm:c.comm, rev:x.rev, gpm, cm, share: pl.revenue ? 100*x.rev/pl.revenue : 0 };
  });

  // Gross margin / contribution use the same light->deep purple ramp as the
  // funnel bars elsewhere (they're the same two metrics, just drawn as a
  // ladder here) — --bad stays reserved for the one thing that's actually
  // lost (the commission gap), consistent with how red is used everywhere else.
  const bar = (gpm, cm) => {
    const W = 260, scale = v => 4 + (v/100)*(W-8);
    return `<svg viewBox="0 0 ${W} 52" width="100%" style="height:52px">
      <rect x="4" y="6" width="${scale(gpm)-4}" height="14" fill="#9B7FC4" rx="1"/>
      <text x="${scale(gpm)+6}" y="17" font-size="10" font-weight="600" fill="#1C1B22">${gpm.toFixed(1)}%</text>
      <rect x="4" y="27" width="${scale(cm)-4}" height="14" fill="#2E1A4D" rx="1"/>
      <rect x="${scale(cm)}" y="27" width="${scale(gpm)-scale(cm)}" height="14" fill="#C4326E" rx="1"/>
      <text x="${scale(gpm)+6}" y="38" font-size="10" font-weight="600" fill="#1C1B22">${cm.toFixed(1)}%</text>
      <text x="4" y="50" font-size="9" fill="#6B6478">gross → contribution</text></svg>`;
  };

  document.getElementById('ladder').innerHTML = `
    <div class="card"><h3>Where the margin goes, by channel</h3>
    <div class="note">Every channel starts from a near-identical gross margin. This shows what survives its own commission.</div>
    <div class="ladder">${rungs.map(r=>{
      const drop = r.gpm - r.cm, big = drop > 10;
      return `<div class="rung${big?' alert':''}">
        <div class="rname">${r.name}</div>
        <div class="rmeta">${r.share.toFixed(1)}% of total revenue · ${money(r.rev)} · ${(r.comm*100).toFixed(0)}% commission</div>
        ${bar(r.gpm, r.cm)}
        <span class="drop ${big?'big':'small'}">−${drop.toFixed(1)}pp to commission</span></div>`;
    }).join('')}</div>
    <div class="legend"><span><i style="background:#9B7FC4"></i>Gross margin</span>
      <span><i style="background:#C4326E"></i>Lost to commission</span>
      <span><i style="background:#2E1A4D"></i>Contribution retained</span></div></div>`;
}

// ═══════════════════════════════════════════════════════════
// LOCATION SCORECARD — click a row to filter everything
// ═══════════════════════════════════════════════════════════
function buildScorecard() {
  const [a,b] = resolveRange();
  const pl = computePL(a, b, {locs: new Set(), chans: STATE.chans, cats: STATE.cats});
  const rows = DATA.locations.map((l,i) => {
    const x = pl.byLoc[i];
    const gp = x.rev - x.cogs, op = gp - x.comm - x.opex;
    return { i, name:l.name, fmt:l.format, cohort:l.cohort, rev:x.rev,
             gpm: x.rev?100*gp/x.rev:0, comm:x.comm, opex:x.opex, op,
             opm: x.rev?100*op/x.rev:0, rsqm: x.rev/l.sqm };
  }).filter(r => r.rev > 0).sort((p,q) => q.opm - p.opm);

  document.getElementById('scorecard').innerHTML = `
    <div class="card"><h3>Location scorecard</h3>
    <div class="note">Ranked by operating margin. Click a row to filter the entire dashboard to that location.</div>
    <table><thead><tr><th>Location</th><th>Format</th><th>Cohort</th><th>Revenue</th><th>GP %</th>
      <th>Commission</th><th>Opex</th><th>Op profit</th><th>Op %</th><th>Rev / m²</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${STATE.locs.has(r.i)?'sel':''}" onclick="toggleLoc(${r.i})">
      <td>${r.name}${r.opm<0?'<span class="tag t-flag">loss-making</span>':''}</td>
      <td>${r.fmt}</td><td><span class="tag" style="background:${COHORT_TAG_COLOR[r.cohort]};color:#FFFFFF">${cohortLabel(r.cohort)}</span></td>
      <td>${money(r.rev)}</td><td>${r.gpm.toFixed(1)}%</td><td>${money(r.comm)}</td><td>${money(r.opex)}</td>
      <td class="${r.op>=0?'up':'down'}">${money(r.op)}</td>
      <td class="${r.opm>=0?'up':'down'}"><b>${r.opm.toFixed(1)}%</b></td>
      <td>${moneyK(r.rsqm)}</td></tr>`).join('')}</tbody></table></div>`;
}

function toggleLoc(i) {
  if (STATE.locs.has(i)) { STATE.locs.clear(); STATE.view='format'; STATE.selectedLoc=null; }
  else { STATE.locs.clear(); STATE.locs.add(i); STATE.view='location'; STATE.selectedLoc=i; }
  render();
}

// ═══════════════════════════════════════════════════════════
// SECTION 2 — SALES & GROSS PROFIT
// ═══════════════════════════════════════════════════════════

// Sequential purple ramp for the revenue -> gross profit -> contribution funnel.
// These are NESTED measures (contribution is inside GP is inside revenue), so the
// colour job is sequential (light = top of funnel, dark = what survives), not
// categorical. Steps chosen so adjacent bars stay separable under colour-blindness.
const FUNNEL = [
  { key:'rev', label:'Net revenue',   color:'#9B7FC4' },
  { key:'gp',  label:'Gross profit',  color:'#6B44A6' },
  { key:'cn',  label:'Contribution',  color:'#2E1A4D' }
];

// Shared config for the two grouped-bar breakdowns (channel and category).
function funnelBarConfig(labels, rows) {
  return {
    type: 'bar',
    data: { labels, datasets: FUNNEL.map(f => ({
      label: f.label, data: rows.map(r => r[f.key]), backgroundColor: f.color,
      borderRadius: { topLeft:4, topRight:4 },   // round the data-end only
      categoryPercentage: 0.68, barPercentage: 0.9
    })) },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, font:{size:11}, color:'#3A3644' } },
        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${MXN(c.parsed.y)}` } }
      },
      scales: { x: AXIS, y: { ...AXIS, beginAtZero:true, ticks:{ ...AXIS.ticks, callback: MXN } } } }
  };
}

// Turn a byChan/byCat bucket into the derived measures every Section 2 visual needs.
function funnelRow(name, x, totalRev, extra = {}) {
  const gp = x.rev - x.cogs, cn = gp - x.comm;
  return { name, rev:x.rev, gp, cn, units:x.units, disc:x.disc, comm:x.comm,
    gpm:  x.rev ? 100*gp/x.rev : 0,
    cnm:  x.rev ? 100*cn/x.rev : 0,
    share: totalRev ? 100*x.rev/totalRev : 0,
    // discount is expressed against GROSS sales (net + discount), the standard base
    discPct: (x.rev + x.disc) ? 100*x.disc/(x.rev + x.disc) : 0, ...extra };
}

function buildSalesTrend(a, b) {
  document.getElementById('salesTrend').innerHTML = `
    <div class="card"><h3>Revenue trend</h3>
    <div class="note">Net revenue by month, grouped by store format.</div>
    <div class="chartBox"><canvas id="revChart"></canvas></div></div>`;
  drawChart(a, b);   // canvas must exist in the DOM before Chart.js binds to it
}

// ---------- by channel ----------
function buildChannelBreakdown(a, b) {
  // NOTE: deliberately passes an EMPTY channel filter. This chart's whole job is
  // comparing channels — if it honoured the channel chips it would collapse to a
  // single bar and answer nothing. Location and category filters DO apply.
  const pl = computePL(a, b, { locs: STATE.locs, chans: new Set(), cats: STATE.cats });
  const rows = DATA.channels.map((c,i) => funnelRow(c.name, pl.byChan[i], pl.revenue, { rate:c.comm }));

  document.getElementById('chanBreak').innerHTML = `
    <div class="card"><h3>Channel breakdown</h3>
    <div class="note">Net revenue, gross profit and contribution by channel, in absolute pesos.</div>
    <div class="chartBox"><canvas id="chanChart"></canvas></div>
    <table style="margin-top:16px"><thead><tr>
      <th>Channel</th><th>Commission</th><th>Units</th><th>Discount %</th><th>Net revenue</th>
      <th>% of total revenue</th><th>Gross profit</th><th>GP %</th><th>Contribution</th><th>Contribution %</th>
    </tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td>${r.name}</td><td>${(r.rate*100).toFixed(0)}%</td><td>${num(r.units)}</td>
      <td>${r.discPct.toFixed(2)}%</td><td>${money(r.rev)}</td><td>${r.share.toFixed(1)}%</td>
      <td>${money(r.gp)}</td><td>${r.gpm.toFixed(1)}%</td>
      <td>${money(r.cn)}</td><td><b>${r.cnm.toFixed(1)}%</b></td></tr>`).join('')}
    </tbody></table></div>`;

  upsertChart('chanChart', funnelBarConfig(rows.map(r => r.name), rows));
}

// ---------- by category ----------
function buildCategoryBreakdown(a, b) {
  // Same reasoning as channel: empty category filter so all three always show.
  const pl = computePL(a, b, { locs: STATE.locs, chans: STATE.chans, cats: new Set() });
  const rows = DATA.categories.map((c,i) => funnelRow(c, pl.byCat[i], pl.revenue));

  document.getElementById('catBreak').innerHTML = `
    <div class="card"><h3>Category breakdown</h3>
    <div class="note">Net revenue, gross profit and contribution by category, in absolute pesos.</div>
    <div class="chartBox"><canvas id="catChart"></canvas></div>
    <table style="margin-top:16px"><thead><tr>
      <th>Category</th><th>Units</th><th>Discount %</th><th>Net revenue</th><th>% of total revenue</th>
      <th>Gross profit</th><th>GP %</th><th>Contribution</th><th>Contribution %</th>
    </tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td>${r.name}</td><td>${num(r.units)}</td><td>${r.discPct.toFixed(2)}%</td>
      <td>${money(r.rev)}</td><td>${r.share.toFixed(1)}%</td>
      <td>${money(r.gp)}</td><td>${r.gpm.toFixed(1)}%</td>
      <td>${money(r.cn)}</td><td><b>${r.cnm.toFixed(1)}%</b></td></tr>`).join('')}
    </tbody></table></div>`;

  upsertChart('catChart', funnelBarConfig(rows.map(r => r.name), rows));
}

// ---------- category x channel contribution matrix ----------
// Cross-tab. computePL returns byCat and byChan separately, never their
// intersection, so this walks the sales fact once and accumulates on both keys.
function catChanCells(a, b) {
  const cells = DATA.categories.map(() => DATA.channels.map(() => ({ rev:0, cogs:0, comm:0 })));
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  for (const r of DATA.sales) {
    const [m, l, c, p, q, net] = r;
    if (m < a || m > b || !okL(l)) continue;
    const x = cells[DATA.products[p].cat][c];
    x.rev += net; x.cogs += q * DATA.products[p].cost; x.comm += net * DATA.channels[c].comm;
  }
  return cells;
}

function buildCatChanMatrix(a, b) {
  const cells = catChanCells(a, b);
  // FIXED colour scale (0-75%), not min-max of the current view. A relative scale
  // would repaint every cell whenever a filter changed, so the same shade would
  // mean different things at different times.
  const shade = v => `background:rgba(91,51,153,${(Math.max(0, Math.min(v,75))/75*0.55).toFixed(3)})`;

  document.getElementById('catChanMatrix').innerHTML = `
    <div class="card"><h3>Contribution margin — category × channel</h3>
    <div class="note">Contribution margin (%) by category and channel, after commission.</div>
    <table class="mtx"><thead><tr><th>Category</th>
      ${DATA.channels.map(c => `<th>${c.name}<br><span style="font-weight:400;text-transform:none;letter-spacing:0">${(c.comm*100).toFixed(0)}% commission</span></th>`).join('')}
      <th>All channels</th></tr></thead><tbody>
    ${DATA.categories.map((cat, ci) => {
      const tot = cells[ci].reduce((s,x) => ({ rev:s.rev+x.rev, cogs:s.cogs+x.cogs, comm:s.comm+x.comm }), {rev:0,cogs:0,comm:0});
      const cm = x => x.rev ? 100*(x.rev - x.cogs - x.comm)/x.rev : 0;
      return `<tr><td>${cat}</td>
        ${cells[ci].map(x => {
          const v = cm(x);
          return `<td><span class="cell" style="${shade(v)}">
            ${v.toFixed(1)}%<small>${money(x.rev)} revenue</small></span></td>`;
        }).join('')}
        <td><span class="cell" style="${shade(cm(tot))}">${cm(tot).toFixed(1)}%<small>${money(tot.rev)} revenue</small></span></td></tr>`;
    }).join('')}
    </tbody></table>
    <div class="legend" style="margin-top:12px">
      <span class="swatch"><i style="background:rgba(91,51,153,0.12)"></i>lower contribution</span>
      <span class="swatch"><i style="background:rgba(91,51,153,0.55)"></i>higher contribution</span>
    </div></div>`;
}

// ---------- by location: efficiency vs profitability ----------
// "Efficient" (revenue per m² — space/sales density) and "profitable" (operating
// margin) are different questions per the handoff, so this plots them on separate
// axes rather than blending into one score. Colour = cohort — the direct answer
// to "how are new locations performing." Always shows all 16 locations (same
// convention as the scorecard); respects period/channel/category filters.
function buildLocationEfficiency(a, b) {
  const pl = computePL(a, b, { locs:new Set(), chans:STATE.chans, cats:STATE.cats });
  const pts = DATA.locations.map((l,i) => {
    const x = pl.byLoc[i]; const op = x.rev - x.cogs - x.comm - x.opex;
    return { name:l.name, fmt:l.format, cohort:l.cohort, rev:x.rev,
             rsqm: x.rev / l.sqm, opm: x.rev ? 100*op/x.rev : 0 };
  }).filter(p => p.rev > 0);

  const avgRsqm = pts.reduce((s,p)=>s+p.rsqm,0) / pts.length;
  const avgOpm  = pts.reduce((s,p)=>s+p.opm,0)  / pts.length;

  const COHORTS = ['2025 openings','2024 openings','Same-store'];

  const datasets = COHORTS.map(c => {
    const rows = pts.filter(p => p.cohort === c);
    return {
      label: cohortLabel(c),
      data: rows.map(p => ({ x:p.rsqm, y:p.opm, name:p.name, fmt:p.fmt })),
      backgroundColor: COHORT_COLOR[c],
      // a genuinely negative operating margin gets a red ring — --bad is
      // reserved for real losses, and Condesa is the only one here
      pointBorderColor: rows.map(p => p.opm < 0 ? BRAND.bad : COHORT_COLOR[c]),
      pointBorderWidth: rows.map(p => p.opm < 0 ? 2 : 0),
      pointRadius: 6, pointHoverRadius: 8
    };
  });

  // live check on "how are new locations performing" — do they actually cluster
  // below the same-store average, or is the spread similar?
  const ssRows = pts.filter(p => p.cohort === 'Same-store');
  const ssAvg = ssRows.length ? ssRows.reduce((s,p)=>s+p.opm,0)/ssRows.length : null;
  const newRows = pts.filter(p => p.cohort !== 'Same-store');
  const newMin = newRows.length ? Math.min(...newRows.map(p=>p.opm)) : null;
  const newMax = newRows.length ? Math.max(...newRows.map(p=>p.opm)) : null;

  document.getElementById('locBreak').innerHTML = `
    <div class="card"><h3>Efficiency vs profitability by location</h3>
    <div class="note">${periodLabel()}. X = revenue per m² (space efficiency). Y = operating margin
    (profitability). Dashed lines mark the group average on each axis; colour is cohort.</div>
    <div class="chartBoxTall"><canvas id="locEffChart"></canvas></div>
    ${newRows.length ? `<div class="assume" style="margin-top:12px">New-store operating margins range from
    <b>${newMin.toFixed(1)}%</b> to <b>${newMax.toFixed(1)}%</b>${ssAvg!==null?`, spanning both sides of the
    <b>${ssAvg.toFixed(1)}%</b> average for established locations`:''} — opening year alone doesn't predict performance.
    The point below the x-axis is Condesa; see the Income Statement tab for the peer diagnosis.</div>` : ''}
    </div>`;

  upsertChart('locEffChart', {
    type: 'scatter',
    data: { datasets },
    options: { responsive:true, maintainAspectRatio:false,
      plugins: {
        legend: { position:'bottom', labels:{ boxWidth:12, font:{size:11}, color:'#3A3644' } },
        tooltip: { callbacks: {
          title: c => c[0].raw.name,
          label: c => [c.raw.fmt, '$'+Math.round(c.raw.x/1e3)+'k/m²', c.parsed.y.toFixed(1)+'% op margin']
        } }
      },
      scales: {
        x: { ...AXIS, title:{ display:true, text:'Revenue / m²', color:'#6B6478', font:{size:11} },
             ticks:{ ...AXIS.ticks, callback:v=>'$'+Math.round(v/1e3)+'k' } },
        y: { ...AXIS, title:{ display:true, text:'Operating margin', color:'#6B6478', font:{size:11} },
             ticks:{ ...AXIS.ticks, callback:v=>v+'%' } }
      } },
    plugins: [{
      id: 'avgLines',
      afterDraw(chart) {
        const { ctx, chartArea:{left,right,top,bottom}, scales:{x,y} } = chart;
        ctx.save(); ctx.strokeStyle = '#D8D4E2'; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
        const yPix = y.getPixelForValue(avgOpm);
        ctx.beginPath(); ctx.moveTo(left, yPix); ctx.lineTo(right, yPix); ctx.stroke();
        const xPix = x.getPixelForValue(avgRsqm);
        ctx.beginPath(); ctx.moveTo(xPix, top); ctx.lineTo(xPix, bottom); ctx.stroke();
        ctx.restore();
      }
    }]
  });
}

// ---------- individual product ----------
// The 4th named analysis dimension (location/channel/category are all built
// above; product wasn't). Sortable by clicking a column header — click again
// to flip direction. Imputed-cost products (DQ1) are flagged here; this is
// the only place that flag is visible anywhere in the dashboard.
const PROD_COLS = [
  { key:'name',    label:'Product',      type:'text' },
  { key:'cat',     label:'Category',     type:'text' },
  { key:'price',   label:'Price',        type:'num' },
  { key:'cost',    label:'Cost',         type:'num' },
  { key:'units',   label:'Units',        type:'num' },
  { key:'rev',     label:'Revenue',      type:'num' },
  { key:'discPct', label:'Discount %',   type:'num' },
  { key:'gp',      label:'Gross profit', type:'num' },
  { key:'gpm',     label:'Margin %',     type:'num' }
];

function buildProductTable(a, b) {
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  const okC = c => STATE.chans.size === 0 || STATE.chans.has(c);
  const okK = k => STATE.cats.size === 0 || STATE.cats.has(k);

  const agg = DATA.products.map(() => ({ units:0, rev:0, disc:0, cogs:0 }));
  for (const r of DATA.sales) {
    const [m, l, c, p, q, net, disc] = r;
    if (m < a || m > b || !okL(l) || !okC(c) || !okK(DATA.products[p].cat)) continue;
    agg[p].units += q; agg[p].rev += net; agg[p].disc += disc;
    agg[p].cogs += q * DATA.products[p].cost;
  }

  let rows = DATA.products.map((prod,i) => {
    const x = agg[i]; const gp = x.rev - x.cogs;
    return {
      name: prod.name, cat: DATA.categories[prod.cat], price: prod.price, cost: prod.cost,
      imputed: prod.imputed, units: x.units, rev: x.rev,
      discPct: (x.rev + x.disc) ? 100*x.disc/(x.rev+x.disc) : 0,
      gp, gpm: x.rev ? 100*gp/x.rev : 0
    };
  }).filter(r => r.units > 0);

  const { key, dir } = STATE.prodSort;
  rows.sort((p,q) => typeof p[key] === 'string' ? dir*p[key].localeCompare(q[key]) : dir*(p[key]-q[key]));

  const headerCell = c => {
    const active = STATE.prodSort.key === c.key;
    return `<th data-key="${c.key}" style="cursor:pointer">${c.label}${active ? (STATE.prodSort.dir===1?' ▲':' ▼') : ''}</th>`;
  };

  document.getElementById('prodTable').innerHTML = `
    <div class="card"><h3>Product detail</h3>
    <div class="note">${periodLabel()}. Click a column header to sort. "Imputed cost" products had no
    standard cost in the source data — cost is estimated from category cost ratios (see DQ1).</div>
    <table><thead><tr>${PROD_COLS.map(headerCell).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td>${r.name}${r.imputed ? '<span class="tag t-flag">imputed cost</span>' : ''}</td>
      <td>${r.cat}</td>
      <td>${moneyUnit(r.price)}</td>
      <td>${moneyUnit(r.cost)}</td>
      <td>${num(r.units)}</td>
      <td>${money(r.rev)}</td>
      <td>${r.discPct.toFixed(2)}%</td>
      <td>${money(r.gp)}</td>
      <td>${r.gpm.toFixed(1)}%</td></tr>`).join('')}
    </tbody></table></div>`;

  document.querySelectorAll('#prodTable th[data-key]').forEach(th => {
    th.onclick = () => {
      const k = th.dataset.key;
      if (STATE.prodSort.key === k) STATE.prodSort.dir *= -1;
      else STATE.prodSort = { key:k, dir: PROD_COLS.find(c=>c.key===k).type === 'text' ? 1 : -1 };
      buildProductTable(a, b);   // re-render just this table — no need to re-filter/re-render the whole tab
    };
  });
}

// ═══════════════════════════════════════════════════════════
// SECTION 3 — INCOME STATEMENT
// ═══════════════════════════════════════════════════════════

// The P&L steps in display order. `sign` says whether the step is a running
// total (anchor) or something being subtracted from the previous anchor.
const PL_STEPS = [
  { key:'revenue',     label:'Net revenue',   type:'total' },
  { key:'cogs',        label:'COGS',          type:'less' },
  { key:'grossProfit', label:'Gross profit',  type:'total' },
  { key:'commission',  label:'Commission',    type:'less' },
  { key:'contribution',label:'Contribution',  type:'total' },
  // `group` is only read by the statement table (adds a header + subtotal row);
  // the waterfall ignores it and keeps these five as individual bars, since
  // collapsing them there would undercut the one chart whose job is showing
  // each cost landing separately.
  { key:'labor',       label:'Labour',        type:'less', group:'Operating costs' },
  { key:'rent',        label:'Rent',          type:'less', group:'Operating costs' },
  { key:'util',        label:'Utilities',     type:'less', group:'Operating costs' },
  { key:'mkt',         label:'Marketing',     type:'less', group:'Operating costs' },
  { key:'other',       label:'Other opex',    type:'less', group:'Operating costs' },
  { key:'operating',   label:'Operating profit', type:'total' }
];

// Chart.js has no native waterfall type, so this is the standard vanilla
// technique: a stacked bar per step with an invisible "base" segment (holds
// the bar at the right height) and a visible "delta" segment on top. Each bar
// lands exactly where the previous one ended, which is the whole point of a
// waterfall — a table alone can't show that.
function buildWaterfall(pl) {
  document.getElementById('waterfall').innerHTML = `
    <div class="card"><h3>Revenue to operating profit</h3>
    <div class="note">Each bar starts where the previous one ended. Purple bars are running
    totals; grey bars are what gets subtracted to reach the next total.</div>
    <div class="chartBoxTall"><canvas id="waterfallChart"></canvas></div></div>`;

  let running = 0;
  const labels = [], base = [], delta = [], colors = [], raw = [];
  PL_STEPS.forEach(s => {
    const v = pl[s.key];
    labels.push(s.label);
    if (s.type === 'total') {
      running = v;
      base.push(0); delta.push(v); colors.push(BRAND.purple); raw.push(v);
    } else {
      base.push(running - v); delta.push(v); colors.push(BRAND.slate); raw.push(-v);
      running -= v;
    }
  });

  upsertChart('waterfallChart', {
    type: 'bar',
    data: { labels, datasets: [
      { label: 'base', data: base, backgroundColor: 'transparent', stack: 's' },
      { label: 'amount', data: delta, backgroundColor: colors, stack: 's',
        borderRadius: 3, borderSkipped: false }
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false },
        tooltip: { filter: c => c.datasetIndex === 1,   // dataset 0 is the invisible spacer
          callbacks: { label: c => (raw[c.dataIndex] < 0 ? '−' : '') + MXN(Math.abs(raw[c.dataIndex])) } } },
      scales: { x: AXIS, y: { ...AXIS, ticks: { ...AXIS.ticks, callback: MXN } } } }
  });
}

// Full statement: every line, amount, % of revenue, PY, variance. This is the
// table someone checks the waterfall's arithmetic against, so it uses the exact
// same PL_STEPS list and the exact same computePL() output as the chart above it.
function buildStatement(cur, py) {
  const rows = PL_STEPS.map(s => {
    const v = cur[s.key];
    const pyV = py ? py[s.key] : null;
    const varAmt = pyV !== null ? v - pyV : null;
    const varPct = (pyV !== null && pyV !== 0) ? 100 * (v / pyV - 1) : null;
    return { ...s, v, pyV, varAmt, varPct };
  });

  // Build table rows, inserting a group header before a group's first line and
  // a "Total <group>" subtotal after its last line — currently just Operating
  // costs (Labour..Other), but this generalises if another group is ever added.
  const trs = [];
  let openGroup = null, agg = null;
  const flushGroup = () => {
    if (!openGroup) return;
    const varAmt = agg.pyV !== null ? agg.v - agg.pyV : null;
    const varPct = (agg.pyV !== null && agg.pyV !== 0) ? 100 * (agg.v / agg.pyV - 1) : null;
    trs.push(`<tr class="subtot">
      <td>Total ${openGroup.toLowerCase()}</td>
      <td class="down">−${money(agg.v)}</td>
      <td>${cur.revenue ? pct(100*agg.v/cur.revenue) : '—'}</td>
      <td>${agg.pyV !== null ? money(agg.pyV) : '—'}</td>
      <td>${varAmt !== null ? `${varAmt>=0?'+':''}${money(varAmt)}${varPct!==null?` (${varPct>=0?'+':''}${varPct.toFixed(1)}%)`:''}` : '—'}</td></tr>`);
    openGroup = null; agg = null;
  };

  rows.forEach(r => {
    if (r.group !== openGroup) {
      flushGroup();
      if (r.group) {
        trs.push(`<tr class="rowgroup"><td colspan="5">${r.group}</td></tr>`);
        openGroup = r.group; agg = { v: 0, pyV: py ? 0 : null };
      }
    }
    if (openGroup) { agg.v += r.v; if (agg.pyV !== null) agg.pyV += r.pyV; }
    trs.push(`<tr class="${r.type === 'total' ? 'subtot' : ''}">
      <td>${r.group ? '&nbsp;&nbsp;' + r.label : r.label}</td>
      <td class="${r.type==='less' && r.v>0 ? 'down' : ''}">${r.type==='less'&&r.v>0?'−':''}${money(r.v)}</td>
      <td>${cur.revenue ? pct(100*r.v/cur.revenue) : '—'}</td>
      <td>${r.pyV !== null ? money(r.pyV) : '—'}</td>
      <td>${r.varAmt !== null
        ? `<span class="${r.type==='total' ? (r.varAmt>=0?'up':'down') : ''}">${r.varAmt>=0?'+':''}${money(r.varAmt)}${r.varPct!==null?` (${r.varPct>=0?'+':''}${r.varPct.toFixed(1)}%)`:''}</span>`
        : '—'}</td></tr>`);
  });
  flushGroup();

  document.getElementById('plStatement').innerHTML = `
    <div class="card"><h3>Full statement</h3>
    <div class="note">${periodLabel()}${py ? ' vs prior-year equivalent' : ' — no prior-year period in range'}.</div>
    <table><thead><tr><th>Line</th><th>Amount</th><th>% of revenue</th>
      <th>Prior year</th><th>Variance</th></tr></thead><tbody>
    ${trs.join('')}
    </tbody></table>
    <div class="note" style="margin-top:10px">Variance is colour-coded only on total/subtotal rows (revenue,
    gross profit, contribution, operating profit), where a higher number is unambiguously better. Cost lines
    grow with volume by design, so a cost increase alone isn't colour-coded good or bad here.</div></div>`;
}

// Operating margin by location — the primary visual here, not the supporting
// element it is on the Executive Summary. Respects period/channel/category
// filters and always shows all 16 locations (same convention as the scorecard).
// The panel beside it is deliberately NOT filtered — it's pinned to Condesa's
// FY2025 story, the same structural comparison as Finding 3, reused via
// worstLocVsPeers() rather than recomputed.
function buildLocMargin(a, b) {
  const pl = computePL(a, b, { locs:new Set(), chans:STATE.chans, cats:STATE.cats });
  const rows = DATA.locations.map((l,i) => {
    const x = pl.byLoc[i]; const op = x.rev - x.cogs - x.comm - x.opex;
    return { name:l.name, rev:x.rev, opm: x.rev ? 100*op/x.rev : 0 };
  }).filter(r => r.rev > 0).sort((p,q) => p.opm - q.opm);

  const cmp = worstLocVsPeers();
  const row = (label, worstV, peerV, gapTxt, cls) =>
    `<div class="peerStat"><span>${label}</span><b>${worstV} <span class="${cls||''}">vs ${peerV}${gapTxt?` (${gapTxt})`:''}</span></b></div>`;

  document.getElementById('locMargin').innerHTML = `
    <div class="grid2col">
      <div class="card"><h3>Operating margin by location</h3>
      <div class="note">${periodLabel()}, sorted low to high.</div>
      <div class="chartBoxTall"><canvas id="locMarginChart"></canvas></div></div>

      <div class="card"><h3>${cmp.worst.name} vs its peers</h3>
      <div class="note">Fixed to full-year 2025 — ${cmp.peers.length} comparable stores, same
      ${cmp.worst.fmt.toLowerCase()} format, ${cohortLabel(cmp.worst.cohort).toLowerCase()}.</div>
      ${row('Revenue', money(cmp.worst.rev), money(cmp.peerRev), `${cmp.revGap.toFixed(1)}%`, 'down')}
      ${row('Gross margin', pct(cmp.worst.gpm), pct(cmp.peerGpm), `${cmp.gpmGap>=0?'+':''}${cmp.gpmGap.toFixed(1)}pp`, '')}
      ${row('Opex (absolute)', money(cmp.worst.opex), money(cmp.peerOpex), `${cmp.opexGap>=0?'+':''}${cmp.opexGap.toFixed(1)}%`, cmp.opexGap<=0?'up':'down')}
      ${row('Opex % of revenue', pct(cmp.worst.opexPctRev), pct(cmp.peerOpexPct), `${cmp.opexPctGap>=0?'+':''}${cmp.opexPctGap.toFixed(1)}pp`, 'down')}
      ${row('Operating margin', pct(cmp.worst.opm), pct(cmp.peerOpm), `${cmp.opmGap>=0?'+':''}${cmp.opmGap.toFixed(1)}pp`, 'down')}
      <div class="assume" style="margin-top:12px">Gross margin and absolute opex are both close to peers — this
      store isn't overspending. It carries a similar fixed cost base on ${Math.abs(cmp.revGap).toFixed(0)}% less
      revenue, which is what pushes opex-to-revenue up and operating margin negative. The open question for the
      client is demand at this site, not its cost control.</div></div>
    </div>`;

  upsertChart('locMarginChart', {
    type: 'bar',
    data: { labels: rows.map(r => r.name), datasets: [{
      data: rows.map(r => r.opm),
      backgroundColor: rows.map(r => r.opm < 0 ? BRAND.bad : BRAND.good),
      borderRadius: 3, barPercentage: 0.75
    }] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false },
        tooltip: { callbacks: { label: c => pct(c.parsed.x) } } },
      scales: { x: { ...AXIS, ticks: { ...AXIS.ticks, callback: v => v.toFixed(0)+'%' } }, y: AXIS } }
  });
}

// Actual net revenue vs monthly sales target. Both series are on the same
// revenue scale, so one y-axis is correct — no dual-axis. Respects the same
// location/channel/category filters as the rest of Section 3.
function buildSalesTargetChart(a, b) {
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  const okC = c => STATE.chans.size === 0 || STATE.chans.has(c);
  const okP = p => STATE.cats.size === 0 || STATE.cats.has(DATA.products[p].cat);
  const okK = k => STATE.cats.size === 0 || STATE.cats.has(k);

  const months = DATA.months.slice(a, b+1);
  const actual = new Array(months.length).fill(0);
  const target = new Array(months.length).fill(0);

  for (const r of DATA.sales) {
    const [m, l, c, p, q, net] = r;
    if (m < a || m > b || !okL(l) || !okC(c) || !okP(p)) continue;
    actual[m - a] += net;
  }
  for (const r of DATA.targets) {
    const [m, l, c, k, st] = r;
    if (m < a || m > b || !okL(l) || !okC(c) || !okK(k)) continue;
    target[m - a] += st;
  }
  const totalActual = actual.reduce((s,v)=>s+v,0), totalTarget = target.reduce((s,v)=>s+v,0);

  document.getElementById('salesTarget').innerHTML = `
    <div class="card"><h3>Sales vs target</h3>
    <div class="note">${periodLabel()} — actual net revenue vs monthly sales target.
    ${totalTarget ? `Attainment ${pct(100*totalActual/totalTarget)} (${money(totalActual-totalTarget)} gap).` : ''}</div>
    <div class="chartBoxShort"><canvas id="salesTargetChart"></canvas></div></div>`;

  upsertChart('salesTargetChart', {
    type: 'line',
    data: { labels: months, datasets: [
      { label:'Actual', data: actual, borderColor: BRAND.purple, backgroundColor: BRAND.purple,
        borderWidth:2, pointRadius:0, tension:.25 },
      { label:'Target', data: target, borderColor: BRAND.slate, backgroundColor: BRAND.slate,
        borderWidth:2, borderDash:[5,4], pointRadius:0, tension:.25 }
    ] },
    options: { responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins: { legend:{ position:'bottom', labels:{boxWidth:12,font:{size:11},color:'#3A3644'} },
        tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${MXN(c.parsed.y)}` } } },
      scales: { x:AXIS, y:{...AXIS, ticks:{...AXIS.ticks, callback:MXN}} } }
  });
}

// ═══════════════════════════════════════════════════════════
// SECTION 4 — INVENTORY
// ═══════════════════════════════════════════════════════════

// Real calendar days, not a 30-day approximation — days-of-inventory divides
// by this, so a flat 30 would quietly misstate every location by up to ~3.5%.
function daysInMonth(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo, 0).getDate();
}
function daysInRange(a, b) {
  let d = 0;
  for (let i = a; i <= b; i++) d += daysInMonth(DATA.months[i]);
  return d;
}

// Waste rate by location — same waste ÷ (usage + waste) definition as Finding 4
// on the Executive Summary, so this can't quietly disagree with it. Sorted
// worst to best. Always shows all 16 locations (ignores the location filter,
// same convention as the scorecard); inventory has no channel/category
// dimension to filter by at all.
function buildWasteByLoc(a, b) {
  const usage = new Array(DATA.locations.length).fill(0);
  const waste = new Array(DATA.locations.length).fill(0);
  for (const r of DATA.inventory) {
    const [m, l, it, op, pu, us, wa] = r;
    if (m < a || m > b) continue;
    const c = DATA.items[it].cost;
    usage[l] += us * c; waste[l] += wa * c;
  }
  const rows = DATA.locations.map((loc,i) => ({
    name: loc.name, wastePct: (usage[i]+waste[i]) ? 100*waste[i]/(usage[i]+waste[i]) : 0
  })).sort((p,q) => q.wastePct - p.wastePct);

  const avg = rows.reduce((s,r)=>s+r.wastePct,0) / rows.length;

  document.getElementById('wasteByLoc').innerHTML = `
    <div class="card"><h3>Waste rate by location</h3>
    <div class="note">${periodLabel()}. Waste ÷ (consumption + waste), sorted worst to best.
    Ringed bars are more than 2× the group average. Always shows all 16 locations.</div>
    <div class="chartBoxTall"><canvas id="wasteByLocChart"></canvas></div></div>`;

  upsertChart('wasteByLocChart', {
    type: 'bar',
    data: { labels: rows.map(r=>r.name), datasets: [{
      data: rows.map(r=>r.wastePct),
      backgroundColor: BRAND.purple,
      borderColor: rows.map(r => r.wastePct > 2*avg ? BRAND.bad : BRAND.purple),
      borderWidth: rows.map(r => r.wastePct > 2*avg ? 2 : 0),
      borderSkipped:false, borderRadius:3, barPercentage:0.75
    }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label:c=>pct(c.parsed.x) } } },
      scales: { x:{...AXIS, ticks:{...AXIS.ticks, callback:v=>v.toFixed(0)+'%'}}, y:AXIS } }
  });
}

// Consumption vs waste value over time — checks whether the rate is stable,
// rising, or seasonal. Respects the location filter; channel/category don't
// apply here since inventory carries neither dimension in the source data.
function buildWasteOverTime(a, b) {
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  const months = DATA.months.slice(a, b+1);
  const usage = new Array(months.length).fill(0);
  const waste = new Array(months.length).fill(0);
  for (const r of DATA.inventory) {
    const [m, l, it, op, pu, us, wa] = r;
    if (m < a || m > b || !okL(l)) continue;
    const c = DATA.items[it].cost;
    usage[m-a] += us*c; waste[m-a] += wa*c;
  }
  const rates = months.map((_,i) => (usage[i]+waste[i]) ? 100*waste[i]/(usage[i]+waste[i]) : 0);
  const rMin = Math.min(...rates), rMax = Math.max(...rates);

  document.getElementById('wasteOverTime').innerHTML = `
    <div class="card"><h3>Consumption and waste over time</h3>
    <div class="note">${periodLabel()}. Inventory has no channel or category dimension, so only
    the period and location filters apply on this tab.</div>
    <div class="chartBoxTall"><canvas id="wasteOverTimeChart"></canvas></div>
    ${months.length > 1 ? `<div class="assume" style="margin-top:12px">Monthly waste rate ranges from
    <b>${rMin.toFixed(1)}%</b> to <b>${rMax.toFixed(1)}%</b> over this period —
    ${rMax-rMin < 2 ? 'stable, no clear seasonal swing.' : 'some month-to-month variation; check the chart for a seasonal pattern.'}</div>` : ''}
    </div>`;

  upsertChart('wasteOverTimeChart', {
    type: 'line',
    data: { labels: months, datasets: [
      { label:'Consumption', data:usage, borderColor:BRAND.purple, backgroundColor:BRAND.purple,
        borderWidth:2, pointRadius:0, tension:.25 },
      { label:'Waste', data:waste, borderColor:BRAND.bad, backgroundColor:BRAND.bad,
        borderWidth:2, pointRadius:0, tension:.25 }
    ] },
    options: { responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins: { legend:{ position:'bottom', labels:{boxWidth:12,font:{size:11},color:'#3A3644'} },
        tooltip:{ callbacks:{ label:c => `${c.dataset.label}: ${MXN(c.parsed.y)}` } } },
      scales: { x:AXIS, y:{...AXIS, ticks:{...AXIS.ticks, callback:MXN}} } }
  });
}

// Waste value by item, top 10 of 15 — shows WHERE the money is, even though
// the waste RATE (previous chart) is close to uniform. Two lenses on the same
// problem: rate says "process issue everywhere," value says a handful of
// high-volume items (likely coffee beans) carry most of the peso impact.
function buildWasteByItem(a, b) {
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  const wasteVal = new Array(DATA.items.length).fill(0);
  for (const r of DATA.inventory) {
    const [m, l, it, op, pu, us, wa] = r;
    if (m < a || m > b || !okL(l)) continue;
    wasteVal[it] += wa * DATA.items[it].cost;
  }
  const rows = DATA.items.map((item,i) => ({ name:item.name, val:wasteVal[i] }))
    .sort((p,q) => q.val - p.val);
  const top = rows.slice(0, 10);
  const restVal = rows.slice(10).reduce((s,r)=>s+r.val,0);
  const shown = restVal > 0 ? [...top, { name:`All other items (${rows.length-10})`, val:restVal, other:true }] : top;

  document.getElementById('wasteByItem').innerHTML = `
    <div class="card"><h3>Waste value by item</h3>
    <div class="note">${periodLabel()}. Top 10 of ${rows.length} items by peso value written off.</div>
    <div class="chartBoxTall"><canvas id="wasteByItemChart"></canvas></div></div>`;

  upsertChart('wasteByItemChart', {
    type: 'bar',
    data: { labels: shown.map(r=>r.name), datasets: [{
      data: shown.map(r=>r.val),
      backgroundColor: shown.map(r => r.other ? BRAND.slate : BRAND.purple),
      borderRadius:3, barPercentage:0.75
    }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label:c=>MXN(c.parsed.x) } } },
      scales: { x:{...AXIS, ticks:{...AXIS.ticks, callback:MXN}}, y:AXIS } }
  });
}

// Days of inventory by location — closing stock value ÷ average daily
// consumption value. Flags both directions: unusually high (cash tied up,
// spoilage risk) and unusually low (stockout risk). Always shows all 16
// locations, respects the period filter only.
function buildDoiByLoc(a, b) {
  const days = daysInRange(a, b);
  const usageVal = new Array(DATA.locations.length).fill(0);
  const closeVal = new Array(DATA.locations.length).fill(0);
  for (const r of DATA.inventory) {
    const [m, l, it, op, pu, us, wa, cl] = r;
    if (m < a || m > b) continue;
    const c = DATA.items[it].cost;
    usageVal[l] += us * c;
    if (m === b) closeVal[l] += cl * c;   // stock is a snapshot — only the last month counts
  }
  const rows = DATA.locations.map((loc,i) => {
    const dailyUsage = usageVal[i] / days;
    return { name: loc.name, doi: dailyUsage ? closeVal[i] / dailyUsage : 0 };
  }).filter(r => r.doi > 0).sort((p,q) => q.doi - p.doi);

  const avg = rows.reduce((s,r)=>s+r.doi,0) / rows.length;

  document.getElementById('doiByLoc').innerHTML = `
    <div class="card"><h3>Days of inventory by location</h3>
    <div class="note">${periodLabel()}. Closing stock value ÷ average daily consumption value.
    Ringed bars are more than 1.5× the group average in either direction. Always shows all 16 locations.</div>
    <div class="chartBoxTall"><canvas id="doiByLocChart"></canvas></div></div>`;

  upsertChart('doiByLocChart', {
    type: 'bar',
    data: { labels: rows.map(r=>r.name), datasets: [{
      data: rows.map(r=>r.doi),
      backgroundColor: BRAND.purple,
      borderColor: rows.map(r => (r.doi > 1.5*avg || r.doi < avg/1.5) ? BRAND.bad : BRAND.purple),
      borderWidth: rows.map(r => (r.doi > 1.5*avg || r.doi < avg/1.5) ? 2 : 0),
      borderSkipped:false, borderRadius:3, barPercentage:0.75
    }] },
    options: { indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins: { legend:{display:false}, tooltip:{ callbacks:{ label:c=>c.parsed.x.toFixed(1)+' days' } } },
      scales: { x:{...AXIS, ticks:{...AXIS.ticks, callback:v=>v.toFixed(0)}}, y:AXIS } }
  });
}

// Item-level detail — purchases, consumption, waste, waste%, closing stock,
// days of cover. The detail layer under the four summary charts above.
// Respects the location filter (aggregates across all locations if none
// selected) and the period.
function buildItemTable(a, b) {
  const okL = l => STATE.locs.size === 0 || STATE.locs.has(l);
  const days = daysInRange(a, b);
  const purch = new Array(DATA.items.length).fill(0);
  const usage = new Array(DATA.items.length).fill(0);
  const waste = new Array(DATA.items.length).fill(0);
  const close = new Array(DATA.items.length).fill(0);
  for (const r of DATA.inventory) {
    const [m, l, it, op, pu, us, wa, cl] = r;
    if (m < a || m > b || !okL(l)) continue;
    purch[it] += pu; usage[it] += us; waste[it] += wa;
    if (m === b) close[it] += cl;
  }
  const rows = DATA.items.map((item,i) => {
    const wastePct = (usage[i]+waste[i]) ? 100*waste[i]/(usage[i]+waste[i]) : 0;
    const dailyUsage = usage[i] / days;
    return { name:item.name, unit:item.unit, purch:purch[i], usage:usage[i], waste:waste[i],
             wastePct, wasteVal: waste[i]*item.cost, close:close[i],
             doi: dailyUsage ? close[i] / dailyUsage : 0 };
  }).sort((p,q) => q.wasteVal - p.wasteVal);

  document.getElementById('itemTable').innerHTML = `
    <div class="card"><h3>Item-level detail</h3>
    <div class="note">${periodLabel()}. Quantities are in each item's native unit.</div>
    <table><thead><tr><th>Item</th><th>Purchases</th><th>Consumption</th><th>Waste</th>
      <th>Waste %</th><th>Waste value</th><th>Closing stock</th><th>Days of cover</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td>${r.name}</td>
      <td>${num(r.purch)} ${r.unit}</td>
      <td>${num(r.usage)} ${r.unit}</td>
      <td>${num(r.waste)} ${r.unit}</td>
      <td>${r.wastePct.toFixed(1)}%</td>
      <td>${money(r.wasteVal)}</td>
      <td>${num(r.close)} ${r.unit}</td>
      <td>${r.doi.toFixed(1)}</td></tr>`).join('')}
    </tbody></table></div>`;
}

const TABS = [
  { id:'exec',      label:'Executive Summary' },
  { id:'sales',     label:'Sales & Gross Profit' },
  { id:'pl',        label:'Income Statement' },
  { id:'inventory', label:'Inventory' }
];

function buildTabs() {
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  TABS.forEach(t => {
    const b = document.createElement('button');
    b.textContent = t.label;
    b.className = STATE.tab === t.id ? 'on' : '';
    b.onclick = () => { STATE.tab = t.id; render(); };
    box.appendChild(b);
  });
  // show only the active section
  document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
  const active = document.getElementById('sec-' + STATE.tab);
  if (active) active.classList.add('on');
}
